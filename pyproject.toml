[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-3d-agent"
version = "0.1.0"
description = "Local-first Hunyuan3D generation service and Codex Skill"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7",
  "huggingface-hub>=1.23,<2",
  "Pillow>=10,<12",
  "sentencepiece>=0.2,<1",
  "rembg>=2,<3",
  "trimesh>=4.4,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a real CUDA GPU and large model inference"]
